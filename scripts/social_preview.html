<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box}body{margin:0;width:1280px;height:640px;background:radial-gradient(900px 420px at 50% -40px,#1b2f55 0%,#0b0e14 70%);font-family:"Segoe UI","Selawik","Noto Sans",system-ui,sans-serif;color:#f0f6fc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;overflow:hidden}

.ring{width:128px;height:128px;position:relative;flex:none}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:8}
.ring b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:32px}.ring small{display:block;color:#8b949e;font-size:14px;font-weight:400}
.t h2{margin:0;font-size:32px}.t p{margin:6px 0 0;color:#8b949e;font-size:19px}
.btn{display:inline-block;margin-top:16px;margin-right:10px;padding:9px 22px;border-radius:12px;background:#121824;font-weight:600;font-size:17px}.btn.p{background:#1f6feb}
h1{margin:0;font-size:60px;letter-spacing:-.025em}h1 span{color:#58a6ff}
.tag{color:#8b949e;font-size:26px;margin-top:-18px}
</style>
